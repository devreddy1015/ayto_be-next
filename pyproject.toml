# This file is TOOL CONFIGURATION ONLY — ruff and pytest settings for the
# monorepo. There is no importable `ayto` package at the root; the real code
# lives under packages/*/src. Poetry and uv both try to install the root
# project by default, which fails with "No file/folder found for package ayto",
# so package mode is turned off below.
[project]
name = "ayto"
version = "0.1.0"
description = "SportIQ — Professional-grade sports analytics from any smartphone"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["packages/cv-core/tests", "packages/pose-biomechanics/tests", "packages/ml-models/tests", "packages/core/tests"]
python_files = "test_*.py"
python_functions = "test_*"
