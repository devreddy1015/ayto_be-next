stages:
  download_videos:
    cmd: python packages/data-research/scripts/download_videos.py
    outs:
      - data/raw/videos

  preprocess_frames:
    cmd: python packages/data-research/scripts/preprocess.py
    deps:
      - data/raw/videos
    outs:
      - data/processed/frames

  # TrackNetV3 background input + TrackNetV4 motion attention (see research/).
  train_tracknet:
    cmd: python packages/cv-core/src/train_tracknet.py --data TrackNetV2 --background --motion
    deps:
      - TrackNetV2
    outs:
      - models/tracknet.pt
    metrics:
      - models/tracknet_history.json:
          cache: false

  train_stroke_classifier:
    cmd: python packages/ml-models/src/train.py --config packages/ml-models/configs/default.yaml
    deps:
      - data/processed/strokes
    outs:
      - models/stroke_classifier.pt
      - models/stroke_classifier.ckpt
    metrics:
      - models/classifier_metrics.json:
          cache: false
