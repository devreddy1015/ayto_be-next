# ============================================================================
#  Ayto Stroke Classifier — Production Config
#
#  Every value is justified by published research or BWF tournament data.
#  See ../RESEARCH_NOTES.md for the papers behind the architecture choices.
# ============================================================================

# === Data Paths ===
data_dir: data/processed/strokes
save_dir: models

# === Sport ===
# Selects the class taxonomy in src/stroke_taxonomy.py (badminton, tennis,
# table_tennis, pickleball, squash).  num_classes is derived from it.
sport: badminton

# === Clip Window ===
# Strokes are cut around hit frames (dataset.clip_around_hits): ±0.5 s
# (round(fps/2) frames) each side, capped at the neighbouring hits, max
# 1.5 s — the BST (arXiv 2502.21085) protocol.  45 frames @ 30 fps = 1.5 s,
# so the ±15-frame window is edge-padded with the hit at index 22.
seq_len: 45

# Frame rate clips are cut at.  Decimate 60 fps captures to 30 fps first so
# per-frame velocities keep the scale the model was trained on.
fps: 30

# === Input Layout ===
# One tensor per frame: [pose | shuttle | position]; input_size is derived
# (27 + 5 + 4 = 36).  Keeping a single input keeps the TFLite graph simple.
#
# 9 key joints × 3 coordinates (x, y, z).
pose_dim: 27

# Shuttle [x, y, visibility, dx, dy] (dataset.shuttle_features).  BST's main
# gain over pose-only models came from the shuttle trajectory.  0 = pose-only.
shuttle_dim: 5
shuttle_conf_index: 2   # visibility channel; frames with 0 use a learned "missing" token

# Hitter + opponent court (x, y), normalised.  Fused with the shuttle stream,
# not concatenated raw into pose — BST found raw concatenation hurt.
position_dim: 4

# === Architecture ===
# 168 = 8 heads × 21 dim/head.  ≈1.67 M params with the trajectory stream
# (≈1.79 M with ASF), inside the 2 M budget for Snapdragon 680 TFLite.
model_dim: 168
hidden_size: 168

# 3 Transformer layers give sufficient receptive field for 45 tokens
# and reduce FLOPs by 25 % vs 4 layers.
num_layers: 3

# Increased from 0.25 → 0.30 for our small-data regime (<5 k clips).
# Higher regularisation prevents overfitting (Srivastava et al. 2014).
dropout: 0.30

# 168 / 8 = 21 dim/head, shared by self-, cross- and pooling attention.
num_heads: 8

# Up to 5 s of video at 30 fps for rally-context analysis.
max_seq_len: 150

# Kernel 9 captures full backswing (~300 ms @ 30 fps ≈ 9 frames).
temporal_kernels: [3, 5, 9]

# Adjacent-Stroke Fusion (TemPose-TF-ASF, arXiv 2605.02558): condition on the
# neighbouring strokes' predicted classes via two-stage inference.  Improved
# every model it was added to; needs rally archives (hit_frames + labels).
# Off by default so the exported graph keeps a single input.
asf: false
# Share of training clips whose neighbour context is zeroed, so the model
# also learns the stage-1 (no context) regime.
asf_context_dropout: 0.5

# === Training ===
# Effective batch = 24 × 2 (grad_accum) = 48.  Smaller micro-batch
# gives better gradient noise for small datasets (Masters & Luschi 2018).
batch_size: 24

# 3 × 10⁻⁴ is the "magic LR" for small Transformers with AdamW
# (Loshchilov & Hutter 2019, Karpathy empirical).
lr: 0.0003

# ViT papers use 0.05–0.3; 0.05 is conservative for our data size
# (Touvron et al. 2021).
weight_decay: 0.05

# β₂ = 0.98 is standard for Transformers (Vaswani et al. 2017, GPT-2).
betas: [0.9, 0.98]

# Cosine schedule needs room to converge; with patience = 20 the
# effective run is 60–90 epochs via early stopping.
epochs: 120

# Transformers show non-monotonic val curves — 20 epochs gives time
# for late-stage gains.
patience: 20

# Linear warmup over ~7 % of total epochs, matching DeiT.
warmup_epochs: 8

# Lower LR floor lets cosine anneal deeper for boundary refinement.
min_lr_ratio: 0.01

# Tighter clipping prevents gradient spikes from rare minority classes
# (defensive, net).
grad_clip: 0.5

# Effective batch = 24 × 2 = 48 without extra GPU memory pressure.
grad_accum_steps: 2

# === Augmentation ===
augment: true

# MediaPipe keypoint noise ≈ 0.5–1 % of frame dimensions.
# 0.008 adds noise at sensor noise floor without corrupting topology
# (applied to the pose block only).
noise_std: 0.008

# 15 % masking to simulate camera occlusion (player body blocking arm).
# Matches MAE-style masking ratios.
temporal_mask_prob: 0.15

# Drop individual joint coordinates → forces body-topology inference.
feature_dropout_prob: 0.03

# Blank the shuttle over a random 30–100 % span on 30 % of clips: phone
# shuttle tracks drop out under occlusion and motion blur, so the fusion
# gate must learn to fall back on pose.
shuttle_dropout_prob: 0.3

# Stronger mixup for 6-class with imbalance (Zhang et al. 2018).
mixup_alpha: 0.3

# Stroke transitions are genuinely ambiguous (drop ↔ net, clear ↔ lob).
# 0.08 reflects ~8 % annotation disagreement rate.
label_smoothing: 0.08

balanced_sampler: true
class_weights: true

# === Hardware ===
amp: true
seed: 2024
num_workers: 2     # Async data loading for GPU training.

# === Logging ===
use_wandb: false
wandb_project: ayto-stroke-classifier

# === Export / Real-Time Inference ===
onnx_opset: 18                # Native opset of the dynamo ONNX exporter
target_latency_ms: 12          # Per-clip budget on Snapdragon 680 (not read by code)

# === Hit Detection (python src/train.py --task hitnet) ===
# MonoTrack-style HitNet (arXiv 2204.01899): ~16 K params + sequence
# decoding reached hit F1 0.946 vs 0.699 for velocity-peak detection.
hitnet:
  data_dir: data/processed/rallies
  save_dir: models
  fps: 30
  # Per-frame input: shuttle [x, y, visibility, dx, dy] + pose + position.
  pose_dim: 4          # both wrists (x, y)
  position_dim: 4      # hitter + opponent court (x, y)
  conv_channels: 32
  hidden_size: 32      # ≈17 K params with the inputs above
  dropout: 0.1
  window: 90           # 3 s training windows; evaluation runs on full rallies
  label_radius: 1      # ±1-frame hit targets absorb annotation jitter
  min_gap_s: 0.3       # decoder minimum hit spacing
  tolerance_frames: 2  # hit-F1 matching tolerance
  epochs: 60
  batch_size: 32
  lr: 0.001
  weight_decay: 0.01
  warmup_epochs: 3
  min_lr_ratio: 0.05
  grad_clip: 1.0
  seed: 2024
